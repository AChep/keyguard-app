name: "Build Android Baseline Profiles"
inputs:
  build-flavor:
    description: 'Build Flavor'
    required: true
  artifact-prefix:
    description: 'Artifact Tag'
    required: true
    default: ""
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/prepare_kvm
    - name: "Generate baseline profiles"
      id: baseline-profiles
      uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a
      with:
        api-level: 33
        arch: x86_64
        disable-animations: true
        disk-size: 4G
        script: >-
          RESULT=0;
          ./gradlew
          :androidApp:generate${{ inputs.build-flavor }}BaselineProfile
          -Pkeyguard.nativeCrypto.cargoOffline=true || RESULT=$?;
          mkdir -p artifacts/ || RESULT=$?;
          adb pull /storage/emulated/0/Movies/ artifactsScreenRecording/ || true;
          exit "$RESULT"
    - name: "Check retired crypto dependency and profile policy"
      shell: bash
      run: |
        ./gradlew checkBouncyCastleProductionDependencies
        mapfile -d '' profile_directories < <(
          find androidApp/src \
            -type d \
            -path '*/generated/baselineProfiles' \
            -print0
        )
        if (( ${#profile_directories[@]} == 0 )); then
          echo "No generated baseline profile directories found" >&2
          exit 1
        fi
        policy_arguments=()
        for directory in "${profile_directories[@]}"; do
          policy_arguments+=(--artifact "$directory")
        done
        python3 scripts/check_bouncycastle_policy.py "${policy_arguments[@]}"
    - name: 'Upload baseline profile screen recordings'
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      if: always()
      with:
        name: ${{ inputs.artifact-prefix }}baselineprofile-screen-recordings
        path: |
          artifactsScreenRecording/
        retention-days: 7
    - name: 'Upload baseline profile logs'
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      if: always()
      with:
        name: ${{ inputs.artifact-prefix }}baselineprofile-logs
        path: |
          androidBenchmark/build/outputs/androidTest-results/
          androidBenchmark/build/outputs/connected_android_test_additional_output/
        retention-days: 7
    - name: 'Remove baseline profile apks'
      shell: bash
      run: |
        rm -rf androidApp/build/outputs/apk/ || true
        rm -rf androidApp/build/outputs/mapping/ || true
