name: "Setup browser extension"
description: "Build the Wasm crypto of util/crypto, then install the browser extension's dependencies and generate its sources"
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup_gradle
    # Emscripten runs on Python.
    - uses: ./.github/actions/setup_python
    - name: "Setup Rust toolchain"
      uses: ./.github/actions/setup_rust
      with:
        cache-key: browser-extension
    # cargo-about, for the licenses of the Rust crates in the Wasm crypto.
    - uses: ./.github/actions/setup_cargo_tools
      with:
        tools: cargo-about
    # For the toolchain that util/crypto/rust-toolchain.toml selects.
    - name: "Add the Emscripten Rust target"
      shell: bash
      working-directory: util/crypto
      run: rustup target add wasm32-unknown-emscripten
    # Gradle installs the Emscripten SDK that RustWasmLibraryPlugin.kt pins
    # into the Gradle user home, once per version.
    - name: "Cache the Emscripten SDK"
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.gradle/keyguard/emsdk
        key: emsdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('buildPlugins/src/main/kotlin/com/artemchep/keyguard/buildplugins/cargo/RustWasmLibraryPlugin.kt') }}
    # The Noise-only build, which browserExtension/package.json links. Gradle
    # runs without the runner's Android SDK and NDK, as BUILDING.md promises.
    - name: "Build the Wasm crypto"
      shell: bash
      run: |
        unset ANDROID_HOME ANDROID_SDK_ROOT "${!ANDROID_NDK@}"
        ./gradlew :util:crypto:buildNativeCryptoWasmNoise
    - name: "Install pnpm"
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      with:
        package_json_file: browserExtension/package.json
    - name: "Set up Node"
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version-file: browserExtension/.nvmrc
        package-manager-cache: false
    - name: "Install dependencies"
      shell: bash
      working-directory: browserExtension
      run: pnpm install --frozen-lockfile
    # Localized strings from the app's resources (Gradle, without the Android
    # SDK), the protobuf types and the licenses of the Rust crates.
    - name: "Generate sources"
      shell: bash
      working-directory: browserExtension
      run: |
        unset ANDROID_HOME ANDROID_SDK_ROOT "${!ANDROID_NDK@}"
        pnpm generate
