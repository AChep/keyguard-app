name: "Setup Gradle"
description: "Install the JDK and configure the shared Gradle cache"
inputs:
  # We use Jetbrains distribution because it contains many fixes
  # for AWT. For example, with the other distributions I can not
  # make a POPUP window and have an input field in it.
  java-distribution:
    description: 'Java Distribution'
    required: true
    default: 'jetbrains'
  java-version:
    description: 'Java Version'
    required: true
    default: '21'
  cache-write-only:
    description: 'Cache Write Only'
    required: true
    default: 'false'
  gradle-properties:
    description: 'Job-specific Gradle properties'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - name: "Setup JDK"
      id: setup-java
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
      # JetBrains Runtime lookup reads this env var for GitHub API auth;
      # otherwise hosted runners share the anonymous IP rate limit.
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}
    - name: "Setup Gradle daemon JDK (Windows ARM64)"
      if: ${{ runner.os == 'Windows' && runner.arch == 'ARM64' }}
      id: setup-daemon-java
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
      with:
        distribution: microsoft
        java-version: '21.0.1'
        architecture: aarch64
    - name: "Setup Gradle"
      uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884
      env:
        JAVA_HOME: ${{ steps.setup-daemon-java.outputs.path || steps.setup-java.outputs.path }}
      with:
        cache-write-only: ${{ inputs.cache-write-only }}
    - name: "Configure CI Gradle defaults"
      shell: bash
      env:
        # A runner runs one build at a time, so it keeps the shared Kotlin daemon
        # and a heap that fits the smallest hosted runners.
        CI_GRADLE_PROPERTIES: |
          kotlin.compiler.execution.strategy=daemon
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
      run: bash "$GITHUB_ACTION_PATH/setup_gradle_properties.sh"
    - name: "Configure Gradle daemon JDK (Windows ARM64)"
      if: ${{ runner.os == 'Windows' && runner.arch == 'ARM64' }}
      shell: bash
      env:
        GRADLE_DAEMON_JAVA_HOME: ${{ steps.setup-daemon-java.outputs.path }}
        GRADLE_TOOLCHAIN_JAVA_HOME: ${{ steps.setup-java.outputs.path }}
      run: |
        # Daemon criteria override org.gradle.java.home; remove them only in this CI checkout.
        rm -- gradle/gradle-daemon-jvm.properties
        # Java properties treat backslashes as escapes. Keep JBR available for app packaging.
        daemon_java_home="${GRADLE_DAEMON_JAVA_HOME//\\//}"
        toolchain_java_home="${GRADLE_TOOLCHAIN_JAVA_HOME//\\//}"
        printf -v CI_GRADLE_PROPERTIES 'org.gradle.java.home=%s\norg.gradle.java.installations.paths=%s' \
          "$daemon_java_home" "$toolchain_java_home"
        export CI_GRADLE_PROPERTIES
        bash "$GITHUB_ACTION_PATH/setup_gradle_properties.sh"
    - name: "Configure CI Gradle properties"
      if: ${{ inputs.gradle-properties != '' }}
      shell: bash
      env:
        CI_GRADLE_PROPERTIES: ${{ inputs.gradle-properties }}
      run: bash "$GITHUB_ACTION_PATH/setup_gradle_properties.sh"
