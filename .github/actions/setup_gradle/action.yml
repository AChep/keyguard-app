name: "Setup Gradle"
inputs:
  # We use Jetbrains distribution because it contains many fixes
  # for AWT. For example, with the other distributions I can not
  # make a POPUP window and have an input field in it.
  java-distribution:
    description: 'Java Distribution'
    required: true
    default: 'jetbrains'
  java-version:
    description: 'Java Version'
    required: true
    default: '21'
  cache-write-only:
    description: 'Cache Write Only'
    required: true
    default: 'false'
runs:
  using: "composite"
  steps:
    - name: "Setup JDK"
      id: setup-java
      uses: actions/setup-java@v5.7.0
      # JetBrains Runtime lookup reads this env var for GitHub API auth;
      # otherwise hosted runners share the anonymous IP rate limit.
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}
    - name: "Setup Gradle"
      uses: gradle/actions/setup-gradle@v6.3.0
      env:
        JAVA_HOME: ${{ steps.setup-java.outputs.path }}
      with:
        cache-write-only: ${{ inputs.cache-write-only }}
