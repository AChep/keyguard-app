name: "Setup Linux desktop"
description: "Install system dependencies required to build the Linux desktop app"
runs:
  using: "composite"
  steps:
    - name: "Install X11 development files"
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev
        dpkg-query --show --showformat='${Version}\n' libx11-dev
    # Release packaging runs the app once to record its AppCDS archive.
    # Skiko also requires libEGL.so.1, which Xvfb does not provide.
    - name: "Install desktop runtime dependencies"
      shell: bash
      run: sudo apt-get install -y xvfb xauth libegl1
