name: "Setup Protobuf"
description: "Install the Protobuf compiler on the current runner"
runs:
  using: "composite"
  steps:
    - name: "Install Protobuf compiler (Linux)"
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler
        protoc --version
    - name: "Install Protobuf compiler (macOS)"
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install protobuf
        protoc --version
    - name: "Install Protobuf compiler (Windows)"
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install protoc --yes --no-progress
        protoc --version
