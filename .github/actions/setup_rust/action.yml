name: "Setup Rust"
description: "Install the repository's shared Rust toolchain"
inputs:
  toolchain:
    description: "Rust toolchain"
    required: false
    default: "beta-2026-07-15"
  targets:
    description: "Comma-separated Rust targets"
    required: false
    default: ""
  components:
    description: "Comma-separated Rust components"
    required: false
    default: "clippy,rustfmt"
  cache-key:
    description: "Optional Cargo download cache group; build outputs are not cached"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: "Setup Rust toolchain"
      uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
    - name: "Cache Cargo downloads"
      if: inputs.cache-key != ''
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: native-cargo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-${{ inputs.cache-key }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          native-cargo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-${{ inputs.cache-key }}-
