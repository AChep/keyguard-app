name: "Setup WiX"
description: "Download the pinned portable WiX toolset with ARM64 MSI support"
outputs:
  path:
    description: "Directory containing the WiX executables"
    value: ${{ steps.setup.outputs.path }}
runs:
  using: "composite"
  steps:
    - id: setup
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $archive = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
        $directory = Join-Path $env:RUNNER_TEMP 'wix-3.14.1'
        Invoke-WebRequest 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $archive
        $expected = '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31'
        if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
          throw 'WiX archive checksum does not match WiX 3.14.1.'
        }
        Expand-Archive -LiteralPath $archive -DestinationPath $directory -Force
        "path=$directory" >> $env:GITHUB_OUTPUT
