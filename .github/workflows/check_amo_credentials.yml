name: "✔️ Check AMO credentials"

# Checks the API key of addons.mozilla.org in the `amo` environment, which
# the release's `deploy-firefox-add-ons` job uses. Uploads nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-amo-credentials:
    name: Check AMO credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: amo
    defaults:
      run:
        working-directory: browserExtension
    env:
      # browser_specific_settings.gecko.id of the Firefox manifest, see wxt.config.ts.
      ADDON_ID: browser@keyguard.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: "Install pnpm"
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: browserExtension/package.json
      - name: "Set up Node"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: browserExtension/.nvmrc
          package-manager-cache: false
      # As in the release: the submission tool only, without the Wasm build.
      - name: "Install dependencies"
        run: pnpm install --frozen-lockfile --ignore-scripts
      # AMO lists unlisted versions to the add-on's authors only, so this also
      # checks that the key's account is one.
      - name: "Look up the next version on AMO"
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          version=$(sed -nE 's/^appVersionName *= *"(.*)".*/\1/p' ../gradle/libs.versions.toml)
          status=$(node scripts/amo-version.ts "$ADDON_ID" "$version")
          if [ "$status" = exists ]; then
            echo "::notice title=Firefox Add-ons::The API key works. AMO already has $version: a release tag won't submit it again."
          else
            echo "::notice title=Firefox Add-ons::The API key works. AMO doesn't have $version yet: a release tag submits it."
          fi
      # The release's submission tool with the same key. A dry run reads the
      # add-on and stops before the upload; it only checks that the zip exists.
      - name: "Dry-run the submission"
        env:
          FIREFOX_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          placeholder="$RUNNER_TEMP/placeholder-firefox.zip"
          touch "$placeholder"
          pnpm exec wxt-publish-extension --dry-run \
            --firefox-zip "$placeholder" \
            --firefox-extension-id "$ADDON_ID" \
            --firefox-amo-metadata-file amo-metadata.json
