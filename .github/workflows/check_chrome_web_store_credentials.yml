name: "✔️ Check Chrome Web Store credentials"

# Checks the service account and the CRX key in the `chrome-web-store`
# environment, which the release's `deploy-chrome-web-store` job uses.
# Uploads nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-chrome-web-store-credentials:
    name: Check Chrome Web Store credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: chrome-web-store
    defaults:
      run:
        working-directory: browserExtension
    env:
      # The extension's ID on the Chrome Web Store, from
      # URL_BROWSER_EXTENSION_CHROME in
      # common/src/commonMain/kotlin/com/artemchep/keyguard/Urls.kt.
      EXTENSION_ID: pbgoonibllaljhcpadklliddccmhdehh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: "Set up Node"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: browserExtension/.nvmrc
          package-manager-cache: false
      # The store shows the item's status only to the publisher's members, so
      # this also checks that the service account is one.
      - name: "Look up the next version on the Chrome Web Store"
        env:
          CWS_SERVICE_ACCOUNT_EMAIL: ${{ secrets.CWS_SERVICE_ACCOUNT_EMAIL }}
          CWS_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_PRIVATE_KEY }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: |
          if [ -z "$CWS_PUBLISHER_ID" ]; then
            echo "::error title=Chrome Web Store::Set the variable CWS_PUBLISHER_ID in the chrome-web-store environment."
            exit 1
          fi
          version=$(sed -nE 's/^appVersionName *= *"(.*)".*/\1/p' ../gradle/libs.versions.toml)
          status=$(node scripts/cws-version.ts "$CWS_PUBLISHER_ID" "$EXTENSION_ID" "$version")
          case "$status" in
            exists)
              echo "::notice title=Chrome Web Store::The service account works. The Chrome Web Store already has $version: a release tag won't submit it again."
              ;;
            pending)
              echo "::notice title=Chrome Web Store::The service account works. An older version is in review or staged: a release tag of $version skips it with a warning until the review ends, or until you publish or cancel the staged version."
              ;;
            *)
              echo "::notice title=Chrome Web Store::The service account works. The Chrome Web Store doesn't have $version yet: a release tag submits it."
              ;;
          esac
      # Signs an empty zip as a release signs the Chromium zip. This checks
      # that the secret is an RSA private key, not that it matches the public
      # key on file: crx.ts prints its public key to compare by hand.
      - name: "Check the CRX key"
        env:
          CWS_CRX_PRIVATE_KEY: ${{ secrets.CWS_CRX_PRIVATE_KEY }}
        run: |
          if [ -z "$CWS_CRX_PRIVATE_KEY" ]; then
            echo "::notice title=Chrome Web Store::The chrome-web-store environment has no CWS_CRX_PRIVATE_KEY: a release tag uploads the zip, which the store refuses if verified CRX uploads are on."
            exit 0
          fi
          placeholder="$RUNNER_TEMP/placeholder-chrome.zip"
          # The end of central directory record alone: an empty zip.
          { printf 'PK\005\006'; head -c 18 /dev/zero; } > "$placeholder"
          node scripts/crx.ts "$placeholder" "$RUNNER_TEMP/placeholder-chrome.crx"
          echo "::notice title=Chrome Web Store::CWS_CRX_PRIVATE_KEY is an RSA private key: a release tag uploads a CRX signed with it. Compare the public key printed above with the one in Package > Verified CRX Uploads."
