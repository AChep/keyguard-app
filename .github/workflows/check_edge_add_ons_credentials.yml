name: "✔️ Check Edge Add-ons credentials"

# Checks the API key of Microsoft Edge Add-ons in the `edge-web-store`
# environment, which the release's `deploy-edge-add-ons` job uses. Uploads
# nothing. The key expires every 72 days: run this after each new key.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-edge-add-ons-credentials:
    name: Check Edge Add-ons credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: edge-web-store
    defaults:
      run:
        working-directory: browserExtension
    env:
      # The extension's CRX ID on Edge Add-ons, from URL_BROWSER_EXTENSION_EDGE
      # in common/src/commonMain/kotlin/com/artemchep/keyguard/Urls.kt.
      CRX_ID: jmiinenokkmkljkgaahelgacgkjemebb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: "Set up Node"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: browserExtension/.nvmrc
          package-manager-cache: false
      # Asks for the status of a submission that doesn't exist, which an
      # accepted key gets a 404 for. This checks the key, not the product ID:
      # a wrong product ID gets the same 404. The first submission checks it.
      - name: "Check the API key"
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
        run: |
          if [ -z "$EDGE_PRODUCT_ID" ]; then
            echo "::error title=Edge Add-ons::Set the variable EDGE_PRODUCT_ID in the edge-web-store environment."
            exit 1
          fi
          node scripts/edge-check.ts "$EDGE_PRODUCT_ID"
          echo "::notice title=Edge Add-ons::The API key works. The product ID isn't checked: a wrong one gets the same 404. The first submission checks it."
      # As in the release: the API can't read the version, so this asks the
      # public website, which shows the published version only.
      - name: "Look up the next version on Edge Add-ons"
        run: |
          version=$(sed -nE 's/^appVersionName *= *"(.*)".*/\1/p' ../gradle/libs.versions.toml)
          status=$(node scripts/edge-version.ts "$CRX_ID" "$version")
          case "$status" in
            exists)
              echo "::notice title=Edge Add-ons::Edge Add-ons already has $version: a release tag won't submit it again."
              ;;
            absent)
              echo "::notice title=Edge Add-ons::Edge Add-ons doesn't have $version yet: a release tag submits it."
              ;;
            *)
              echo "::notice title=Edge Add-ons::The Edge Add-ons website's version check failed: a release tag submits $version anyway."
              ;;
          esac
