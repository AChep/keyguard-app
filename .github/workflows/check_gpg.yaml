name: "✔️ Check GPG Agent"

on:
  workflow_dispatch:
    inputs:
      cache-write-only:
        description: 'Cache write only'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - master
    paths:
      - 'commonGpgAgent/**'
      - 'commonAgent/**'
      - 'desktopGpgAgent/**'
      - 'integration/gpgE2eTest/**'
      - 'common/src/**/gpgagent/**'
      - 'common/src/**/service/agent/**'
      - 'common/src/**/*Gpg*'
      - 'util/crypto/**'
      - 'thirdParty/rust/**'
      - '.github/actions/setup_protobuf/**'
      - '.github/actions/setup_rust/**'
      - '.github/workflows/check_gpg.yaml'
  pull_request:
    branches:
      - master
    paths:
      - 'commonGpgAgent/**'
      - 'commonAgent/**'
      - 'desktopGpgAgent/**'
      - 'integration/gpgE2eTest/**'
      - 'common/src/**/gpgagent/**'
      - 'common/src/**/service/agent/**'
      - 'common/src/**/*Gpg*'
      - 'util/crypto/**'
      - 'thirdParty/rust/**'
      - '.github/actions/setup_protobuf/**'
      - '.github/actions/setup_rust/**'
      - '.github/workflows/check_gpg.yaml'

permissions:
  contents: read

jobs:
  gpg-rust-tests:
    name: "Rust agent tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: "Setup Rust toolchain"
        uses: ./.github/actions/setup_rust
        with:
          components: "clippy"
      - uses: ./.github/actions/setup_protobuf
      - name: "Run Rust static analysis"
        run: |
          cargo clippy --manifest-path commonAgent/Cargo.toml --all-targets --locked -- -D clippy::undocumented_unsafe_blocks
          cargo clippy --manifest-path commonGpgAgent/Cargo.toml --all-targets --locked -- -D clippy::undocumented_unsafe_blocks
          cargo clippy --manifest-path desktopGpgAgent/src/Cargo.toml --all-targets --locked -- -D clippy::undocumented_unsafe_blocks
      - name: "Test commonGpgAgent crate"
        run: cargo test --manifest-path commonGpgAgent/Cargo.toml
      - name: "Test desktopGpgAgent crate"
        run: cargo test --manifest-path desktopGpgAgent/src/Cargo.toml

  gpg-kotlin-tests:
    name: "Kotlin agent tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup_gradle
        with:
          cache-write-only: ${{ inputs.cache-write-only || false }}
      - name: "Setup Rust toolchain"
        uses: ./.github/actions/setup_rust
        with:
          targets: "x86_64-unknown-linux-gnu"
      - name: "Run GPG agent unit tests"
        run: >-
          ./gradlew :common:desktopTest
          --tests "com.artemchep.keyguard.common.service.gpgagent.*"
          --tests "com.artemchep.keyguard.common.service.crypto.Gpg*"
          --tests "com.artemchep.keyguard.crypto.OpenPgpMutationAndAgentBouncyCastleDifferentialTest"

  gpg-e2e-tests:
    name: "End-to-end (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ubuntu
            gradle: ./gradlew
          - os: macos-latest
            artifact: macos
            gradle: ./gradlew
          - os: windows-latest
            artifact: windows
            gradle: ./gradlew.bat
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup_gradle
        with:
          cache-write-only: ${{ inputs.cache-write-only || false }}
      - name: "Setup Rust toolchain"
        uses: ./.github/actions/setup_rust
        with:
          components: "clippy"
      - uses: ./.github/actions/setup_protobuf
      - name: "Run platform Rust static analysis"
        run: |
          cargo clippy --manifest-path commonAgent/Cargo.toml --all-targets --locked -- -D clippy::undocumented_unsafe_blocks
          cargo clippy --manifest-path desktopGpgAgent/src/Cargo.toml --all-targets --locked -- -D clippy::undocumented_unsafe_blocks
      - name: "Setup gpg (Linux)"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y gnupg
          gpg --version
          gpgconf --version
      - name: "Verify gpg (macOS)"
        if: runner.os == 'macOS'
        shell: bash
        run: |
          gpg --version
          gpgconf --version
      - name: "Setup gpg (Windows)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $originalPath = $env:Path
          $originalMachinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          $chocoPath = "C:\Windows\system32;C:\Windows;C:\Windows\System32\Wbem;C:\Windows\System32\WindowsPowerShell\v1.0\;C:\ProgramData\chocolatey\bin"
          try {
            $env:Path = $chocoPath
            [Environment]::SetEnvironmentVariable("Path", $chocoPath, "Machine")
            choco install gnupg --yes --no-progress
          } finally {
            [Environment]::SetEnvironmentVariable("Path", $originalMachinePath, "Machine")
            $env:Path = $originalPath
          }
          $gpgBin = @(
            "${env:ProgramFiles(x86)}\GnuPG\bin",
            "$env:ProgramFiles\GnuPG\bin"
          ) | Where-Object { Test-Path (Join-Path $_ "gpg.exe") } | Select-Object -First 1
          if (-not $gpgBin) {
            throw "Native GnuPG install not found after Chocolatey install."
          }
          $env:Path = "$gpgBin;$env:Path"
          "KEYGUARD_GPG_BIN_DIR=$gpgBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$gpgBin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          gpg --version
          gpgconf --version
          where.exe gpg
          where.exe gpgconf
      - name: "Run GPG end-to-end tests"
        run: ${{ matrix.gradle }} :integration:gpgE2eTest:gpgE2eTest
      - name: "Upload test reports"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: gpg-e2e-test-reports-${{ matrix.artifact }}
          path: |
            integration/gpgE2eTest/build/reports/tests/
            integration/gpgE2eTest/build/test-results/
          retention-days: 7
