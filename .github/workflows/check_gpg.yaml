name: "✔️ Check GPG Agent"

on:
  workflow_dispatch:
    inputs:
      cache-write-only:
        description: 'Cache write only'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - master
    paths:
      - 'commonGpgAgent/**'
      - 'desktopGpgAgent/**'
      - 'integration/gpgE2eTest/**'
      - 'common/src/**/gpgagent/**'
      - 'common/src/**/service/agent/**'
      - 'common/src/**/*Gpg*'
      - '.github/workflows/check_gpg.yaml'
  pull_request:
    branches:
      - master
    paths:
      - 'commonGpgAgent/**'
      - 'desktopGpgAgent/**'
      - 'integration/gpgE2eTest/**'
      - 'common/src/**/gpgagent/**'
      - 'common/src/**/service/agent/**'
      - 'common/src/**/*Gpg*'
      - '.github/workflows/check_gpg.yaml'

permissions:
  contents: read

jobs:
  gpg-rust-tests:
    name: "Rust agent tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: "Setup Rust toolchain"
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: "1.94.0"
      - name: "Setup Protobuf compiler"
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: "Test commonGpgAgent crate"
        run: cargo test --manifest-path commonGpgAgent/Cargo.toml
      - name: "Test desktopGpgAgent crate"
        run: cargo test --manifest-path desktopGpgAgent/src/Cargo.toml

  gpg-kotlin-tests:
    name: "Kotlin agent tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup_gradle
        with:
          cache-write-only: ${{ inputs.cache-write-only || false }}
      - name: "Run GPG agent unit tests"
        run: ./gradlew :common:desktopTest --tests "com.artemchep.keyguard.common.service.gpgagent.*" --tests "com.artemchep.keyguard.common.service.crypto.Gpg*"

  gpg-e2e-tests:
    name: "End-to-end (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ubuntu
            gradle: ./gradlew
          - os: macos-latest
            artifact: macos
            gradle: ./gradlew
          - os: windows-latest
            artifact: windows
            gradle: ./gradlew.bat
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup_gradle
        with:
          cache-write-only: ${{ inputs.cache-write-only || false }}
      - name: "Setup Rust toolchain"
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: "1.94.0"
      - name: "Setup Protobuf compiler and gpg (Linux)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler gnupg
          gpg --version
          gpgconf --version
      - name: "Setup Protobuf compiler and gpg (macOS)"
        if: runner.os == 'macOS'
        run: |
          brew install protobuf
          protoc --version
          gpg --version
          gpgconf --version
      - name: "Setup Protobuf compiler and gpg (Windows)"
        if: runner.os == 'Windows'
        run: |
          choco install protoc gnupg --yes --no-progress
          $gpgBin = @(
            "${env:ProgramFiles(x86)}\GnuPG\bin",
            "$env:ProgramFiles\GnuPG\bin"
          ) | Where-Object { Test-Path (Join-Path $_ "gpg.exe") } | Select-Object -First 1
          if (-not $gpgBin) {
            throw "Native GnuPG install not found after Chocolatey install."
          }
          $env:Path = "$gpgBin;$env:Path"
          "KEYGUARD_GPG_BIN_DIR=$gpgBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$gpgBin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          protoc --version
          gpg --version
          gpgconf --version
          where.exe gpg
          where.exe gpgconf
      - name: "Run GPG end-to-end tests"
        run: ${{ matrix.gradle }} :integration:gpgE2eTest:gpgE2eTest
      - name: "Upload test reports"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: gpg-e2e-test-reports-${{ matrix.artifact }}
          path: |
            integration/gpgE2eTest/build/reports/tests/
            integration/gpgE2eTest/build/test-results/
          retention-days: 7
