name: "✔️ Check GPG Agent"

on:
  workflow_dispatch:
    inputs:
      cache-write-only:
        description: 'Cache write only'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - master
    paths:
      - 'commonGpgAgent/**'
      - 'commonAgent/**'
      - 'desktopGpgAgent/**'
      - 'androidGpgAgent/**'
      - 'integration/gpgE2eTest/**'
      - 'integration/testProcess/**'
      - 'appleApp/src/**/gpgagent/**'
      - 'appleApp/src/appleMain/kotlin/com/artemchep/keyguard/apple/KeyguardCore.kt'
      - 'appleApp/src/macosMain/kotlin/com/artemchep/keyguard/MacosAppModule.kt'
      - 'appleUi/Sources/KeyguardUI/Apple/GPGAgent/**'
      - 'appleUi/Sources/KeyguardUI/Bridge/GPGAgent/**'
      - 'appleUi/Sources/KeyguardUI/Screens/GpgAgent*'
      - 'macosApp/project.yml'
      - 'macosApp/macosApp/KeyguardGpgAgent.entitlements'
      - 'common/src/**/gpgagent/**'
      - 'common/src/**/service/agent/**'
      - 'common/src/**/*Gpg*'
      - 'util/agent-ipc/**'
      - 'util/crypto/**'
      - 'util/ffi/**'
      - 'thirdParty/rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'buildPlugins/src/main/**'
      - '.github/actions/setup_gpg/**'
      - '.github/actions/setup_protobuf/**'
      - '.github/actions/setup_rust/**'
      - '.github/workflows/check_gpg.yaml'
  pull_request:
    branches:
      - master
    paths:
      - 'commonGpgAgent/**'
      - 'commonAgent/**'
      - 'desktopGpgAgent/**'
      - 'androidGpgAgent/**'
      - 'integration/gpgE2eTest/**'
      - 'integration/testProcess/**'
      - 'appleApp/src/**/gpgagent/**'
      - 'appleApp/src/appleMain/kotlin/com/artemchep/keyguard/apple/KeyguardCore.kt'
      - 'appleApp/src/macosMain/kotlin/com/artemchep/keyguard/MacosAppModule.kt'
      - 'appleUi/Sources/KeyguardUI/Apple/GPGAgent/**'
      - 'appleUi/Sources/KeyguardUI/Bridge/GPGAgent/**'
      - 'appleUi/Sources/KeyguardUI/Screens/GpgAgent*'
      - 'macosApp/project.yml'
      - 'macosApp/macosApp/KeyguardGpgAgent.entitlements'
      - 'common/src/**/gpgagent/**'
      - 'common/src/**/service/agent/**'
      - 'common/src/**/*Gpg*'
      - 'util/agent-ipc/**'
      - 'util/crypto/**'
      - 'util/ffi/**'
      - 'thirdParty/rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'buildPlugins/src/main/**'
      - '.github/actions/setup_gpg/**'
      - '.github/actions/setup_protobuf/**'
      - '.github/actions/setup_rust/**'
      - '.github/workflows/check_gpg.yaml'

permissions:
  contents: read

jobs:
  gpg-rust-tests:
    name: "Rust agent tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: "Setup Rust toolchain"
        uses: ./.github/actions/setup_rust
        with:
          components: "clippy,rustfmt"
      - uses: ./.github/actions/setup_protobuf
      - name: "Run Rust static analysis"
        run: |
          cargo clippy --manifest-path commonAgent/Cargo.toml --all-targets --locked -- -D clippy::undocumented_unsafe_blocks
          cargo clippy --manifest-path commonAgent/proto/Cargo.toml --all-targets --locked -- -D clippy::undocumented_unsafe_blocks
          cargo clippy --manifest-path commonAgent/proto-adapter/Cargo.toml --all-targets --locked -- -D clippy::undocumented_unsafe_blocks
          cargo clippy --manifest-path commonAgent/ipc/Cargo.toml --all-targets --locked -- -D clippy::undocumented_unsafe_blocks
          cargo clippy --manifest-path commonGpgAgent/Cargo.toml --all-targets --locked -- -D clippy::undocumented_unsafe_blocks
          cargo clippy --manifest-path commonGpgAgent/assuan/Cargo.toml --all-targets --locked -- -D clippy::undocumented_unsafe_blocks
          cargo clippy --manifest-path commonAgent/android-bridge/Cargo.toml --all-targets --locked -- -D clippy::undocumented_unsafe_blocks
          cargo clippy --manifest-path androidGpgAgent/src/Cargo.toml --all-targets --locked -- -D clippy::undocumented_unsafe_blocks
          cargo clippy --manifest-path desktopGpgAgent/src/Cargo.toml --all-targets --locked -- -D clippy::undocumented_unsafe_blocks
      - name: "Test shared agent schema, adapters and IPC"
        run: |
          cargo test --manifest-path commonAgent/proto/Cargo.toml --locked
          cargo test --manifest-path commonAgent/proto-adapter/Cargo.toml --locked
          cargo test --manifest-path commonAgent/ipc/Cargo.toml --locked
      - name: "Test commonGpgAgent crate"
        run: cargo test --manifest-path commonGpgAgent/Cargo.toml
      - name: "Test GPG agent Assuan crate"
        run: cargo test --manifest-path commonGpgAgent/assuan/Cargo.toml --locked
      - name: "Test androidGpgAgent crate"
        run: cargo test --manifest-path androidGpgAgent/src/Cargo.toml --locked
      - name: "Test desktopGpgAgent crate"
        run: cargo test --manifest-path desktopGpgAgent/src/Cargo.toml

  gpg-e2e-tests:
    name: "End-to-end (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ubuntu
            gradle: ./gradlew
          - os: macos-latest
            artifact: macos
            gradle: ./gradlew
          - os: windows-latest
            artifact: windows
            gradle: ./gradlew.bat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup_gradle
        with:
          cache-write-only: ${{ inputs.cache-write-only || false }}
      - name: "Setup Rust toolchain"
        uses: ./.github/actions/setup_rust
        with:
          components: "clippy,rustfmt"
      - uses: ./.github/actions/setup_protobuf
      - name: "Run platform Rust static analysis"
        run: |
          cargo clippy --manifest-path commonAgent/Cargo.toml --all-targets --locked -- -D clippy::undocumented_unsafe_blocks
          cargo clippy --manifest-path commonAgent/ipc/Cargo.toml --all-targets --locked -- -D clippy::undocumented_unsafe_blocks
          cargo clippy --manifest-path commonGpgAgent/assuan/Cargo.toml --all-targets --locked -- -D clippy::undocumented_unsafe_blocks
          cargo clippy --manifest-path desktopGpgAgent/src/Cargo.toml --all-targets --locked -- -D clippy::undocumented_unsafe_blocks
      - name: "Test shared caller identity on this platform"
        run: cargo test --manifest-path commonAgent/Cargo.toml --all-targets --locked
      - name: "Test shared caller adapter on this platform"
        run: cargo test --manifest-path commonAgent/proto-adapter/Cargo.toml --all-targets --locked
      - name: "Test shared agent IPC on this platform"
        run: cargo test --manifest-path commonAgent/ipc/Cargo.toml --all-targets --locked
      - name: "Test GPG agent Assuan crate on this platform"
        run: cargo test --manifest-path commonGpgAgent/assuan/Cargo.toml --all-targets --locked
      - name: "Test desktop GPG agent on this platform"
        run: cargo test --manifest-path desktopGpgAgent/src/Cargo.toml --all-targets --locked
      - uses: ./.github/actions/setup_gpg
      - name: "Run GPG end-to-end tests"
        run: ${{ matrix.gradle }} :integration:testProcess:test :integration:gpgE2eTest:gpgE2eTest
      - name: "Upload test reports"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: gpg-e2e-test-reports-${{ matrix.artifact }}
          path: |
            integration/gpgE2eTest/build/reports/tests/
            integration/gpgE2eTest/build/test-results/
            integration/testProcess/build/reports/tests/
            integration/testProcess/build/test-results/
          retention-days: 7
