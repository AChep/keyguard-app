name: "✔️ Check iOS Native E2E Harness"

# The harness drives a simulator and local servers, so CI cannot run its
# journeys. It checks that every command still loads and that the offline
# oracles still match their published test vectors.
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/actions/setup_python/**"
      - ".github/workflows/check_ios_native_e2e.yaml"
      - "integration/iosNativeE2eTest/**"
  pull_request:
    branches:
      - master
    paths:
      - ".github/actions/setup_python/**"
      - ".github/workflows/check_ios_native_e2e.yaml"
      - "integration/iosNativeE2eTest/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-ios-native-e2e:
    name: Check iOS Native E2E Harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup_python
      - name: "Install pinned oracle dependencies"
        run: python -m pip install --requirement integration/iosNativeE2eTest/requirements.txt
      - name: "Compile the harness"
        run: python -m compileall -q integration/iosNativeE2eTest
      - name: "Load every command"
        run: |
          integration/iosNativeE2eTest/e2e help
          for script in integration/iosNativeE2eTest/{core,servers,fixtures,oracles}/[!_]*.py; do
            name="$(basename "$script" .py)"
            integration/iosNativeE2eTest/e2e "$name" --help >/dev/null || {
              echo "::error file=$script::e2e $name --help failed"
              exit 1
            }
          done
      - name: "Check offline oracles against published vectors"
        run: |
          integration/iosNativeE2eTest/e2e otp
          python -I -c 'import sys; sys.path.insert(0, "integration/iosNativeE2eTest"); from oracles import verify_passkey_prf; verify_passkey_prf.self_test()'
