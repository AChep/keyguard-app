name: "✔️ Check Jetifier"

on:
  workflow_dispatch:
  # Jetifier usage only changes with the dependency graph.
  push:
    branches:
      - master
    paths:
      - '**/*.gradle*'
      - 'buildPlugins/src/main/**'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/actions/setup_gradle/**'
      - '.github/workflows/check_jetifier.yml'
  pull_request:
    branches:
      - master
    paths:
      - '**/*.gradle*'
      - 'buildPlugins/src/main/**'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/actions/setup_gradle/**'
      - '.github/workflows/check_jetifier.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-jetifier:
    name: Check Jetifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup_gradle
      - name: "Check Jetifier"
        run: ./gradlew checkJetifier
