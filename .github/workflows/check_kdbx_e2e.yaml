name: "✔️ Check KDBX E2E"

on:
  workflow_dispatch:
    inputs:
      cache-write-only:
        description: "Cache write only"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - master
    paths:
      - ".github/actions/setup_gradle/**"
      - ".github/actions/setup_python/**"
      - ".github/actions/setup_rust/**"
      - ".github/workflows/check_kdbx_e2e.yaml"
      - "build.gradle.kts"
      - "buildPlugins/**"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "integration/kdbxE2eTest/**"
      - "settings.gradle"
      - "util/crypto/**"
      - "util/foundation/**"
      - "util/kdbx/**"
  pull_request:
    branches:
      - master
    paths:
      - ".github/actions/setup_gradle/**"
      - ".github/actions/setup_python/**"
      - ".github/actions/setup_rust/**"
      - ".github/workflows/check_kdbx_e2e.yaml"
      - "build.gradle.kts"
      - "buildPlugins/**"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "integration/kdbxE2eTest/**"
      - "settings.gradle"
      - "util/crypto/**"
      - "util/foundation/**"
      - "util/kdbx/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-kdbx-e2e:
    name: Check KDBX E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup_python
      - uses: ./.github/actions/setup_gradle
        with:
          cache-write-only: ${{ inputs.cache-write-only || false }}
      - name: "Setup Rust toolchain"
        uses: ./.github/actions/setup_rust
        with:
          targets: "x86_64-unknown-linux-gnu"
          components: "clippy,rustfmt"
      - name: "Install pinned PyKeePass runtime"
        run: python -m pip install --requirement integration/kdbxE2eTest/requirements.txt
      - name: "Run KDBX E2E tests"
        run: >-
          ./gradlew --continue
          :integration:kdbxE2eTest:kdbxE2eTest
          -PkdbxE2ePython=python
      - name: "Upload KDBX E2E test reports"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: kdbx-e2e-test-reports
          path: |
            integration/kdbxE2eTest/build/test-results/**
            integration/kdbxE2eTest/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 21
      - name: "Upload failed KDBX interoperability artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: kdbx-e2e-failure-artifacts
          path: integration/kdbxE2eTest/build/kdbxE2eTest/artifacts/**
          if-no-files-found: ignore
          retention-days: 21
