name: "✔️ Check Lint"

on:
  workflow_dispatch:
    inputs:
      cache-write-only:
        description: 'Cache write only'
        required: false
        default: false
        type: boolean
  # Skip changes that no linter here reads: docs, store assets, packaging
  # manifests, Swift and Rust sources, unrelated CI files, translations
  # and bundled data. Keep the inputs of checkAppleConfiguration.
  push:
    branches:
      - master
    paths:
      - '**'
      - '!**/*.md'
      - '!**/*.rs'
      - '!.github/**'
      - '!.vscode/**'
      - '!appleAutofill/**'
      - '!appleUi/**'
      - '!artwork/**'
      - '!cla/**'
      - '!common/src/commonMain/composeResources/files/**'
      - '!common/src/commonMain/composeResources/values-*/**'
      - '!desktopApp/appimage/**'
      - '!desktopApp/flatpak/**'
      - '!desktopApp/msi/**'
      - '!desktopApp/msix/**'
      - '!iosApp/**'
      - '!listing/**'
      - '!macosApp/**'
      - '!screenshots/**'
      - '!scripts/**'
      - '!server/**'
      - '!wiki/**'
      - '!xcode/**'
      - '.github/actions/setup_gradle/**'
      - '.github/workflows/check_lint.yml'
      - 'appleUi/Package.swift'
      - 'scripts/reports/**'
      - 'xcode/DeploymentTargets.xcconfig'
      - 'xcode/Version.xcconfig'
  pull_request:
    branches:
      - master
    paths:
      - '**'
      - '!**/*.md'
      - '!**/*.rs'
      - '!.github/**'
      - '!.vscode/**'
      - '!appleAutofill/**'
      - '!appleUi/**'
      - '!artwork/**'
      - '!cla/**'
      - '!common/src/commonMain/composeResources/files/**'
      - '!common/src/commonMain/composeResources/values-*/**'
      - '!desktopApp/appimage/**'
      - '!desktopApp/flatpak/**'
      - '!desktopApp/msi/**'
      - '!desktopApp/msix/**'
      - '!iosApp/**'
      - '!listing/**'
      - '!macosApp/**'
      - '!screenshots/**'
      - '!scripts/**'
      - '!server/**'
      - '!wiki/**'
      - '!xcode/**'
      - '.github/actions/setup_gradle/**'
      - '.github/workflows/check_lint.yml'
      - 'appleUi/Package.swift'
      - 'scripts/reports/**'
      - 'xcode/DeploymentTargets.xcconfig'
      - 'xcode/Version.xcconfig'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-lint:
    name: Check Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup_gradle
        with:
          cache-write-only: ${{ inputs.cache-write-only || false }}
          # Keep the Kotlin daemon heap consistent across all lint invocations.
          gradle-properties: |
            kotlin.daemon.jvmargs=-Xmx6g
      - name: "Prepare env"
        run: |
          echo ${VARS_GOOGLE_SERVICES} | base64 -d | zcat >> androidApp/google-services.json
          echo ${VARS_GOOGLE_SERVICES} | base64 -d | zcat >> wearApp/google-services.json
          echo "" >> gradle.properties
        env:
          VARS_GOOGLE_SERVICES: ${{ vars.GOOGLE_SERVICES }}
      - name: "Check generated Apple configuration"
        run: ./gradlew --no-parallel --max-workers=2 checkAppleConfiguration
      - name: "Check Android lint"
        run: ./gradlew --continue --no-parallel --max-workers=2 lint
      - name: "Check Detekt"
        if: ${{ !cancelled() }}
        run: ./gradlew --continue --no-parallel --max-workers=2 detekt
      - name: "Check custom Detekt rules"
        if: ${{ !cancelled() }}
        run: ./gradlew --continue --no-parallel --max-workers=1 detektCustomRules
      - name: "Create lint summary"
        if: always()
        shell: bash
        run: |
          ERRORS=$(python './scripts/reports/collect_reports.py' --type android_lint)
          echo '### Android Lint report' >> $GITHUB_STEP_SUMMARY
          if [ -z "$ERRORS" ]; then 
            echo '✅ No Android Lint errors found.' >> $GITHUB_STEP_SUMMARY
          else
            echo '❌ Some Android Lint errors found:' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$ERRORS" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '---' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
      - name: "Read results glob pattern"
        if: always()
        id: read-glob
        shell: bash
        run: |
          file_path="./scripts/reports/glob_android_lint.txt"
          file_content="$(cat $file_path)"
          echo "paths=$file_content" >> "$GITHUB_OUTPUT"
      - name: "Upload results"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reports
          path: "${{ steps.read-glob.outputs.paths }}"
          retention-days: 21
      - name: "Upload Detekt reports"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: detekt-reports
          path: "**/build/reports/detekt/**"
          if-no-files-found: ignore
          retention-days: 21
