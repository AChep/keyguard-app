name: "✔️ Check S3 E2E"

on:
  workflow_dispatch:
    inputs:
      cache-write-only:
        description: 'Cache write only'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - master
    paths:
      - '.github/actions/setup_gradle/**'
      - '.github/actions/setup_rust/**'
      - '.github/workflows/check_s3_e2e.yaml'
      - 'build.gradle.kts'
      - 'buildPlugins/**'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'integration/s3E2eTest/**'
      - 'settings.gradle'
      - 'util/crypto/**'
      - 'util/foundation/**'
      - 'util/s3/**'
  pull_request:
    branches:
      - master
    paths:
      - '.github/actions/setup_gradle/**'
      - '.github/actions/setup_rust/**'
      - '.github/workflows/check_s3_e2e.yaml'
      - 'build.gradle.kts'
      - 'buildPlugins/**'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'integration/s3E2eTest/**'
      - 'settings.gradle'
      - 'util/crypto/**'
      - 'util/foundation/**'
      - 'util/s3/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-s3-e2e:
    name: Check S3 E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup_gradle
        with:
          cache-write-only: ${{ inputs.cache-write-only || false }}
      - name: "Setup Rust toolchain"
        uses: ./.github/actions/setup_rust
        with:
          targets: "x86_64-unknown-linux-gnu"
      - name: "Install versitygw"
        shell: bash
        env:
          VERSITYGW_VERSION: "1.8.0"
          VERSITYGW_SHA256: "2ba2c734d10d2c4e651d03182cb4b246656bc735a2f282db7b0b73fba6073467"
        run: |
          set -euo pipefail

          install_dir="${RUNNER_TEMP}/versitygw"
          archive="${RUNNER_TEMP}/versitygw.tar.gz"
          mkdir -p "${install_dir}"

          curl -sSLf \
            "https://github.com/versity/versitygw/releases/download/v${VERSITYGW_VERSION}/versitygw_v${VERSITYGW_VERSION}_Linux_x86_64.tar.gz" \
            -o "${archive}"
          echo "${VERSITYGW_SHA256}  ${archive}" | sha256sum --check --status

          tar -xzf "${archive}" -C "${install_dir}"
          versitygw_bin="$(find "${install_dir}" -type f -name versitygw -print -quit)"
          test -n "${versitygw_bin}"
          chmod +x "${versitygw_bin}"
          if [ "${versitygw_bin}" != "${install_dir}/versitygw" ]; then
            ln -sf "${versitygw_bin}" "${install_dir}/versitygw"
          fi

          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/versitygw" --version
      - name: "Run S3 E2E tests"
        run: ./gradlew --continue :integration:s3E2eTest:s3E2eTest
      - name: "Upload test reports"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: s3-e2e-test-reports
          path: |
            integration/s3E2eTest/build/test-results/**
            integration/s3E2eTest/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 21
