name: "✔️ Check Swift Format"

on:
  workflow_dispatch:
  # Only Swift sources and the formatter configuration.
  push:
    branches:
      - master
    paths:
      - '**/*.swift'
      - '**/.swift-format-ignore'
      - '.swift-format'
      - '.github/actions/setup_xcode/**'
      - '.github/workflows/check_swift_format.yml'
      - 'xcode/scripts/lint-swift.sh'
  pull_request:
    branches:
      - master
    paths:
      - '**/*.swift'
      - '**/.swift-format-ignore'
      - '.swift-format'
      - '.github/actions/setup_xcode/**'
      - '.github/workflows/check_swift_format.yml'
      - 'xcode/scripts/lint-swift.sh'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-swift-format:
    name: Check Swift Format
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup_xcode
      - name: "Check Swift formatting"
        shell: bash
        run: |
          swift format --version
          xcode/scripts/lint-swift.sh
