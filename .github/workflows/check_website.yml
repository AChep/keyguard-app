name: "✔️ Check website"

on:
  workflow_dispatch:
  # The website, and the app sources and README that link into its docs.
  push:
    branches:
      - master
    paths:
      - 'server/web/**'
      - 'common/src/**'
      - 'README.md'
      - '.github/workflows/check_website.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'server/web/**'
      - 'common/src/**'
      - 'README.md'
      - '.github/workflows/check_website.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VALE_VERSION: '3.24.0'
  VALE_SHA256: '867534ddb678abca7f214bc4706ead0922bd5252ffe8035fc227013f66c8b214'

jobs:
  check-website:
    name: Check website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: "Install pnpm"
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: server/web/package.json
      - name: "Set up Node"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: server/web/.nvmrc
          package-manager-cache: false
      - name: "Install dependencies"
        run: pnpm install --frozen-lockfile
      - name: "Install Vale"
        run: |
          archive="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl -sfLO "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/${archive}"
          echo "${VALE_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/vale"
          tar -xzf "${archive}" -C "$RUNNER_TEMP/vale" vale
          echo "$RUNNER_TEMP/vale" >> "$GITHUB_PATH"
      - name: "Type-check & validate content"
        run: pnpm check
      - name: "Check page structure"
        run: pnpm lint:docs
      - name: "Check prose"
        run: pnpm lint:prose
      - name: "Build"
        run: pnpm build
      - name: "Check links from the app and README"
        run: pnpm check:links
      - name: "Check links in the built site"
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: >-
            --offline
            --include-fragments
            --root-dir ${{ github.workspace }}/server/web/dist
            --index-files index.html
            --no-progress
            server/web/dist
          jobSummary: false
