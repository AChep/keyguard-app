name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  # Privileged event handling is intentional. Only trusted master code is
  # checked out; PR code and comment text are never executed.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, synchronize, edited, ready_for_review, closed]

permissions: {}

jobs:
  cla-assistant:
    name: "Process CLA event"
    if: >-
      github.repository == 'AChep/keyguard-app' &&
      (github.event_name == 'pull_request_target' ||
       (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')))
    # Scope concurrency to eligible jobs so unrelated comments cannot replace
    # pending CLA checks. Each check reads all signing comments; different PRs
    # merge registry updates using the file SHA.
    concurrency:
      group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read # Read the trusted workflow implementation.
      pull-requests: write # Maintain the CLA comment and lock merged PRs.
      statuses: write # Publish the CLA result on the actual PR head commit.
    steps:
      - name: "Checkout trusted implementation"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
          persist-credentials: false
          sparse-checkout: .github
      - name: "Setup Python"
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.10'
      - name: "Check CLA"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Fine-grained PAT: Contents read/write on AChep/keyguard-cla only.
          CLA_REPOSITORY_TOKEN: ${{ secrets.CLA_REPOSITORY_TOKEN }}
        run: python3 -I .github/cla.py
