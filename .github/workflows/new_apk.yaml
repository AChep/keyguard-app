name: "New APK"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-app:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup_gradle
      - uses: ./.github/actions/setup_android_ndk
      - name: "Setup Rust toolchain"
        uses: ./.github/actions/setup_rust
        with:
          targets: "aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android"
      - name: "Prefetch locked native crypto graph"
        run: cargo fetch --manifest-path util/crypto/rust/Cargo.toml --locked
      - name: "Prepare env"
        run: |
          echo ${{ secrets.KEYSTORE_B64 }} | base64 -d | zcat >> androidApp/keyguard-release.keystore
          echo ${{ secrets.KEYSTORE_PROPS_B64 }} | base64 -d | zcat >> androidApp/keyguard-release.properties
          echo ${{ secrets.GOOGLE_SERVICES }} | base64 -d | zcat >> androidApp/google-services.json
          echo "" >> gradle.properties
          echo "versionRef=$(git rev-parse --short HEAD)" >> gradle.properties
          echo buildkonfig.flavor=release >> gradle.properties
      - uses: ./.github/actions/build_android_licenses
        with:
          build-flavor: "None"
      - name: "Build"
        run: >-
          ./gradlew
          :androidApp:assembleNoneRelease
          -Pkeyguard.nativeCrypto.cargoOffline=true
      - name: "Inspect packaged native crypto"
        run: >-
          python scripts/inspect_native_crypto_android.py
          androidApp/build/outputs/apk/none/release/androidApp-none-release.apk
      - name: "Reject Bouncy Castle and SSHJ from packaged APK"
        run: >-
          python scripts/check_bouncycastle_policy.py --artifact
          androidApp/build/outputs/apk/none/release/androidApp-none-release.apk
      - name: 'Upload .apk'
        uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: |
            androidApp/build/outputs/apk/**/*.apk
            androidApp/build/outputs/mapping/**/mapping.txt
          retention-days: 7
