name: "New Flatpak"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-app:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            rust-target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            arch: aarch64
            rust-target: aarch64-unknown-linux-gnu
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup_gradle
      - name: "Setup Rust toolchain"
        uses: ./.github/actions/setup_rust
        with:
          targets: ${{ matrix.rust-target }}
      - name: "Prefetch locked native graphs"
        run: |
          cargo fetch --manifest-path util/crypto/rust/Cargo.toml --locked
          cargo fetch --manifest-path util/zxcvbn/rust/Cargo.toml --locked
      - uses: ./.github/actions/setup_protobuf
      - uses: ./.github/actions/setup_linux_desktop
      - uses: ./.github/actions/setup_python
      - uses: ./.github/actions/build_desktop_licenses
      - name: "Build"
        run: >-
          ./gradlew
          :desktopApp:packageReleaseDistributable
          -Pkeyguard.nativeCrypto.cargoOffline=true
      - name: 'Upload .tar'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-linux-${{ matrix.arch }}
          path: |
            desktopApp/build/distributions/*.tar.gz
      - name: "Move binaries into the template directory"
        run: |
          mkdir -p desktopApp/flatpak/app-${{ matrix.arch }}/
          tar -xvzf $(find . -type f -regex '\./desktopApp/build/distributions/.*\.tar.gz') -C desktopApp/flatpak/app-${{ matrix.arch }}/ --strip-components=1
      - name: "Inspect packaged native crypto"
        shell: bash
        run: |
          mapfile -t libraries < <(find desktopApp/flatpak/app-${{ matrix.arch }} -type f -name 'libkeyguard_crypto_jni.so')
          test "${#libraries[@]}" -eq 1
          python scripts/inspect_native_crypto_desktop.py "${libraries[0]}"
          python scripts/check_bouncycastle_policy.py --artifact desktopApp/flatpak/app-${{ matrix.arch }}
      - name: "Call native crypto through packaged Desktop resources"
        run: >-
          python3 scripts/run_native_crypto_desktop_package_smoke.py
          desktopApp/flatpak/app-${{ matrix.arch }}
      - name: "Get Flatpak runtime version -install dependencies"
        run: pip install -r .github/get_flatpak_runtime_version.requirements.txt
      - name: "Get Flatpak runtime version"
        id: get-flatpak-runtime-version
        run: echo "version=$(python .github/get_flatpak_runtime_version.py desktopApp/flatpak/com.artemchep.keyguard.yml)" >> $GITHUB_OUTPUT
      - name: "Setup Flatpak"
        env:
          FLATPAK_RUNTIME_VERSION: ${{ steps.get-flatpak-runtime-version.outputs.version }}
        run: |
          sudo apt-get update
          sudo apt install flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install flathub "org.freedesktop.Platform//${FLATPAK_RUNTIME_VERSION}" "org.freedesktop.Sdk//${FLATPAK_RUNTIME_VERSION}" -y
      - name: "Build"
        working-directory: desktopApp/flatpak/
        run: |
          flatpak-builder --force-clean --state-dir=build/flatpak-builder --repo=build/flatpak-repo build/flatpak-target com.artemchep.keyguard.yml
          flatpak build-bundle build/flatpak-repo "Keyguard-$(find ../build/distributions -type f -name '*.tar.gz' | sed -E 's/.*-([0-9]+\.[0-9]+\.[0-9]+)-.*/\1/')-${{ matrix.arch }}.flatpak" com.artemchep.keyguard
      - name: 'Upload .flatpak'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-linux-flatpak-${{ matrix.arch }}
          path: |
            desktopApp/flatpak/Keyguard-*.flatpak
