name: "🎉 Release tag -> Deploy relay image"

on:
  push:
    tags:
      - 'r*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: "Publish relay image"
    if: github.repository == 'AChep/keyguard-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: "Produce image version"
        id: version
        run: |
          # The release name, as on the GitHub release: v<app version>-<tag date>.
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            echo "Run this workflow from a release tag (r*)." >&2
            exit 1
          fi
          version="$(python3 .github/get_release_name.py "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: "Setup Docker Buildx"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: "Log in to GitHub Container Registry"
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The Dockerfile cross-links on the build machine, so the arm64 image
      # needs no emulation.
      - name: "Build and push image"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: server/relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/achep/keyguard-relay:${{ steps.version.outputs.version }}
            ghcr.io/achep/keyguard-relay:latest
          labels: |
            org.opencontainers.image.source=https://github.com/AChep/keyguard-app
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.title=Keyguard relay
