name: "Sync upstream release"

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to sync (e.g. r20260616)"
        required: false
permissions:
  contents: write

env:
  UPSTREAM_REPO: AChep/keyguard-app
  LOCAL_REPO: Elnix90/keyguard-app

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.upstream.outputs.tag }}
      should_build: ${{ steps.synced.outputs.already_synced == 'false' && steps.upstream.outputs.found == 'true' }}
    steps:
      - name: "Fetch upstream releases"
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            TAG=$(gh release list -R "$UPSTREAM_REPO" --limit 5 --json tagName,publishedAt \
              --jq 'sort_by(.publishedAt) | reverse | .[0].tagName // empty')
            if [ -n "$TAG" ]; then
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              echo "found=true" >> "$GITHUB_OUTPUT"
            else
              echo "found=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: "Check if already synced"
        if: steps.upstream.outputs.found == 'true'
        id: synced
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          if gh release view "$TAG" -R "$LOCAL_REPO" >/dev/null 2>&1; then
            echo "already_synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_synced=false" >> "$GITHUB_OUTPUT"
          fi

  build-apk:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Setup Gradle"
        uses: ./.github/actions/setup_gradle

      - name: "Setup Rust toolchain"
        uses: ./.github/actions/setup_rust

      - name: "Fetch upstream code at tag"
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git" || true
          git fetch upstream --tags --force
          mkdir -p /tmp/patches /tmp/packaging /tmp/rust-crypto /tmp/thirdparty
          cp -r patches/* /tmp/patches/
          cp -r packaging/* /tmp/packaging/
          cp -r util/crypto/rust/* /tmp/rust-crypto/
          cp -r thirdParty/rust/* /tmp/thirdparty/
          git checkout "$TAG"

      - name: "Apply crack patches"
        run: |
          mkdir -p patches packaging util/crypto/rust thirdParty/rust
          cp -r /tmp/patches/* patches/
          cp -r /tmp/packaging/* packaging/
          cp -r /tmp/rust-crypto/* util/crypto/rust/
          cp -r /tmp/thirdparty/* thirdParty/rust/
          chmod +x patches/apply-crack.sh
          ./patches/apply-crack.sh

      - name: "Cache Rust crypto"
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: util/crypto/rust
          shared-key: apk-crypto

      - name: "Prefetch native crypto"
        run: cargo fetch --manifest-path util/crypto/rust/Cargo.toml --locked

      - name: "Prepare version"
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          APP_VERSION=$(echo "$TAG" | sed 's/^[dr]//')
          echo "" >> gradle.properties
          echo "versionRef=$TAG" >> gradle.properties
          echo "buildkonfig.flavor=release" >> gradle.properties

      - name: "Build APK"
        run: >-
          ./gradlew :androidApp:assembleNoneRelease
          -Pkeyguard.nativeCrypto.cargoOffline=true
          -x lint

      - name: "Upload APK"
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: androidApp/build/outputs/apk/none/release/*.apk
          if-no-files-found: error
          retention-days: 1

  build-desktop:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Setup Gradle"
        uses: ./.github/actions/setup_gradle

      - name: "Setup Linux desktop"
        uses: ./.github/actions/setup_linux_desktop

      - name: "Setup Rust toolchain"
        uses: ./.github/actions/setup_rust

      - name: "Fetch upstream code at tag"
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git" || true
          git fetch upstream --tags --force
          mkdir -p /tmp/patches /tmp/packaging /tmp/rust-crypto /tmp/thirdparty
          cp -r patches/* /tmp/patches/
          cp -r packaging/* /tmp/packaging/
          cp -r util/crypto/rust/* /tmp/rust-crypto/
          cp -r thirdParty/rust/* /tmp/thirdparty/
          git checkout "$TAG"

      - name: "Apply crack patches"
        run: |
          mkdir -p patches packaging util/crypto/rust thirdParty/rust
          cp -r /tmp/patches/* patches/
          cp -r /tmp/packaging/* packaging/
          cp -r /tmp/rust-crypto/* util/crypto/rust/
          cp -r /tmp/thirdparty/* thirdParty/rust/
          chmod +x patches/apply-crack.sh
          ./patches/apply-crack.sh

      - name: "Cache Rust crypto"
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: util/crypto/rust
          shared-key: desktop-crypto

      - name: "Prefetch native crypto"
        run: cargo fetch --manifest-path util/crypto/rust/Cargo.toml --locked

      - name: "Prepare version"
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          APP_VERSION=$(echo "$TAG" | sed 's/^[dr]//')
          echo "" >> gradle.properties
          echo "versionRef=$TAG" >> gradle.properties
          echo "buildkonfig.flavor=release" >> gradle.properties

      - name: "Build DEB + RPM"
        run: >-
          ./gradlew
          :desktopApp:packageReleaseDeb
          :desktopApp:packageReleaseDistributable
          -Pkeyguard.nativeCrypto.cargoOffline=true

      - name: "Install rpmbuild"
        run: sudo apt-get update && sudo apt-get install -y rpm desktop-file-utils hicolor-icon-theme

      - name: "Build RPM"
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          APP_VERSION=$(echo "$TAG" | sed 's/^[dr]//')
          TARBALL=$(find desktopApp/build -name 'Keyguard-*.tar.gz' -print -quit 2>/dev/null)
          if [ -z "$TARBALL" ]; then
            echo "ERROR: No tarball found under desktopApp/build/"
            find desktopApp/build -type f -name '*.tar.gz' 2>/dev/null
            exit 1
          fi
          echo "Found tarball: $TARBALL"
          SOURCES="$PWD/rpmbuild/SOURCES"
          mkdir -p "$SOURCES"
          cp "$TARBALL" "$SOURCES/keyguard-${APP_VERSION}.tar.gz"
          ls -la packaging/
          rpmbuild -ba --nodeps packaging/keyguard.spec \
            --define "_app_version ${APP_VERSION}" \
            --define "_topdir $PWD/rpmbuild" \
            --define "_sourcedir $SOURCES"

      - name: "Upload DEB"
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: desktopApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error
          retention-days: 1

      - name: "Upload RPM"
        uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [check, build-apk, build-desktop]
    if: always() && needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: "Download all artifacts"
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: "Create GitHub release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          ASSETS=""
          for f in artifacts/apk/*.apk artifacts/deb/*.deb artifacts/rpm/**/*.rpm; do
            [ -f "$f" ] && ASSETS="$ASSETS $f"
          done

          gh release create "$TAG" \
            --repo "$LOCAL_REPO" \
            --title "$TAG" \
            --notes "Cracked release synced from $UPSTREAM_REPO" \
            $ASSETS || true

      - name: "Checkout for push"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Push code to master"
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git" || true
          git fetch upstream --tags --force
          mkdir -p /tmp/patches /tmp/packaging /tmp/rust-crypto /tmp/thirdparty
          cp -r patches/* /tmp/patches/
          cp -r packaging/* /tmp/packaging/
          cp -r util/crypto/rust/* /tmp/rust-crypto/
          cp -r thirdParty/rust/* /tmp/thirdparty/
          git checkout "$TAG"

          mkdir -p patches packaging util/crypto/rust thirdParty/rust
          cp -r /tmp/patches/* patches/
          cp -r /tmp/packaging/* packaging/
          cp -r /tmp/rust-crypto/* util/crypto/rust/
          cp -r /tmp/thirdparty/* thirdParty/rust/
          chmod +x patches/apply-crack.sh
          ./patches/apply-crack.sh

          APP_VERSION=$(echo "$TAG" | sed 's/^[dr]//')
          echo "" >> gradle.properties
          echo "versionRef=$TAG" >> gradle.properties
          echo "buildkonfig.flavor=release" >> gradle.properties
          echo "app_version=$APP_VERSION" >> gradle.properties

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B master
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync upstream $TAG with crack"
          git push origin master
