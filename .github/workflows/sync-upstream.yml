name: Sync with upstream + apply crack

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: git remote add upstream https://github.com/AChep/keyguard-app.git || true

      - name: Fetch upstream
        run: git fetch upstream

      - name: Check if upstream has new commits
        id: check
        run: |
          LOCAL=$(git rev-parse master)
          UPSTREAM=$(git rev-parse upstream/master)
          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "upstream_changed=false" >> "$GITHUB_OUTPUT"
          else
            # Check if local has commits not in upstream
            LOCAL_UNIQUE=$(git rev-parse upstream/master..master)
            if [ -z "$LOCAL_UNIQUE" ]; then
              echo "upstream_changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "upstream_changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Merge upstream/master
        if: steps.check.outputs.upstream_changed == 'true'
        run: |
          git merge upstream/master --no-edit -m "Merge upstream/master" || {
            echo "::error::Merge conflict detected. Manual resolution required."
            exit 1
          }

      - name: Apply crack patches
        if: steps.check.outputs.upstream_changed == 'true'
        run: |
          chmod +x patches/apply-crack.sh
          ./patches/apply-crack.sh

      - name: Commit and push
        if: steps.check.outputs.upstream_changed == 'true'
        run: |
          git add -A
          git reset HEAD -- .github/workflows/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: re-apply Elnix90 crack mods after upstream sync"
            git push
          fi
