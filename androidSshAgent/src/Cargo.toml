[package]
name = "keyguard-android-ssh-agent"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Standalone Android SSH agent bridge for Keyguard"
license-file.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "keyguard-android-ssh-agent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["derive"] }
common-ssh-agent-rust.workspace = true
keyguard-android-agent-bridge.workspace = true
libc.workspace = true
prost.workspace = true
rand.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
