[package]
name = "keyguard-agent-identity"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Shared, protocol-neutral caller identity primitives for Keyguard agents"
license-file.workspace = true
repository.workspace = true
publish = false

[dependencies]
# A newer major than the workspace's getrandom.
getrandom = "0.4"
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
anyhow.workspace = true
hex.workspace = true
libc.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "signal", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "test-util", "time"] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
