[package]
name = "keyguard-agent-identity"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Shared, protocol-neutral caller identity primitives for Keyguard agents"
license-file.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
# A newer major than the workspace's getrandom.
getrandom = "0.4"
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
hex.workspace = true
libc.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "signal", "sync", "time"] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
tokio = { workspace = true, features = ["net"] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "test-util", "time"] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
