[package]
name = "keyguard-agent-identity"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.0"
description = "Shared, protocol-neutral caller identity primitives for Keyguard agents"
license-file = "../LICENSE"
repository = "https://github.com/AChep/keyguard-app"
publish = false

[dependencies]
getrandom = "0.4"
sha2 = "0.10"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
anyhow = "1"
hex = "0.4"
libc = "0.2"
tokio = { version = "1", features = ["macros", "net", "rt", "signal", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt", "test-util", "time"] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
