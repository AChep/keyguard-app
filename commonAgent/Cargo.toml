[package]
name = "keyguard-agent-identity"
version = "0.1.0"
edition = "2021"
description = "Shared, protocol-neutral caller identity primitives for Keyguard agents"

[dependencies]
getrandom = "0.4"
sha2 = "0.10"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
hex = "0.4"
libc = "0.2"
tokio = { version = "1", features = ["macros", "net", "rt"] }
tracing = "0.1"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
