syntax = "proto3";

package keyguard.gpgagent;

message IpcRequest {
  uint64 id = 1;

  oneof request {
    AuthenticateRequest authenticate = 2;
    ListKeysRequest list_keys = 3;
    SignHashRequest sign_hash = 4;
    PkdecryptRequest pkdecrypt = 5;
  }
}

message IpcResponse {
  uint64 id = 1;

  oneof response {
    AuthenticateResponse authenticate = 2;
    ListKeysResponse list_keys = 3;
    SignHashResponse sign_hash = 4;
    PkdecryptResponse pkdecrypt = 5;
    ErrorResponse error = 15;
  }
}

message AuthenticateRequest {
  bytes token = 1;
}

message AuthenticateResponse {
  bool success = 1;
}

message CallerIdentity {
  uint32 pid = 1;
  uint32 uid = 2;
  uint32 gid = 3;
  string process_name = 4;
  string executable_path = 5;
  uint32 app_pid = 6;
  string app_name = 7;
  string app_bundle_path = 8;
}

message ListKeysRequest {
  CallerIdentity caller = 1;
}

message ListKeysResponse {
  repeated GpgKey keys = 1;
}

message GpgKey {
  string name = 1;
  string keygrip = 2;
  string fingerprint = 3;
  string algorithm = 4;
  bool can_sign = 5;
  bool can_decrypt = 6;
}

message SignHashRequest {
  string keygrip = 1;
  string hash_algorithm = 2;
  bytes hash = 3;
  CallerIdentity caller = 4;
}

message SignHashResponse {
  // Libgcrypt-style signature S-expression, for example:
  // (sig-val(rsa(s #...#)))
  string sexp = 1;
}

message PkdecryptRequest {
  string keygrip = 1;
  // The canonical (enc-val ...) S-expression that gpg sent to the agent via the
  // Assuan INQUIRE CIPHERTEXT round-trip, relayed verbatim.
  bytes ciphertext = 2;
  CallerIdentity caller = 3;
  // Newer gpg sends `PKDECRYPT --kem=PGP` and expects the agent to complete the
  // OpenPGP ECDH KDF + unwrap. Older gpg sends plain `PKDECRYPT` and expects the
  // legacy shared-secret value so gpg can perform the unwrap itself.
  bool unwrap_ecdh = 4;
}

message PkdecryptResponse {
  // Libgcrypt-style decryption result S-expression, for example:
  // (value #...#)
  // For RSA this carries the raw decryption block. For ECDH it carries either
  // the legacy shared-secret value or the unwrapped session-key block, matching
  // the PkdecryptRequest.unwrap_ecdh mode.
  string value_sexp = 1;
}

message ErrorResponse {
  string message = 1;
  ErrorCode code = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_VAULT_LOCKED = 1;
  ERROR_CODE_USER_DENIED = 2;
  ERROR_CODE_KEY_NOT_FOUND = 3;
  ERROR_CODE_AUTH_FAILED = 4;
  ERROR_CODE_NOT_AUTHENTICATED = 5;
  ERROR_CODE_UNSUPPORTED = 6;
}
