syntax = "proto3";

package keyguard.sshagent;

// The caller, handshake and error messages are shared with the GPG and CLI
// agents: commonAgent/proto.
import "agent.proto";
import "caller.proto";

message IpcRequest {
  uint64 id = 1;

  oneof request {
    keyguard.agent.AuthenticateRequest authenticate = 2;
    ListKeysRequest list_keys = 3;
    SignDataRequest sign_data = 4;
  }
}

message IpcResponse {
  uint64 id = 1;

  oneof response {
    keyguard.agent.AuthenticateResponse authenticate = 2;
    ListKeysResponse list_keys = 3;
    SignDataResponse sign_data = 4;
    keyguard.agent.ErrorResponse error = 15;
  }
}

message ListKeysRequest {
  keyguard.agent.CallerIdentity caller = 1;
}

message ListKeysResponse {
  repeated SshKey keys = 1;
}

message SshKey {
  string name = 1;
  string public_key = 2;
  string key_type = 3;
  string fingerprint = 4;
}

message SignDataRequest {
  string public_key = 1;
  bytes data = 2;
  uint32 flags = 3;
  keyguard.agent.CallerIdentity caller = 4;
}

message SignDataResponse {
  bytes signature = 1;
  string algorithm = 2;
}
