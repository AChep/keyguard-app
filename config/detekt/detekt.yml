config:
  validation: true
  warningsAsErrors: true

complexity:
  LongParameterList:
    ignoreDefaultParameters: true
  TooManyFunctions:
    ignoreAnnotatedFunctions:
      - 'Preview'

naming:
  FunctionNaming:
    # Composable functions are PascalCase by Compose convention.
    ignoreAnnotated:
      - 'Composable'

style:
  ForbiddenImport:
    active: true
    # `runCatchingUntrustedInput` absorbs StackOverflowError and
    # OutOfMemoryError, which is only defensible at a boundary that parses a
    # whole document handed over by another application and throws the
    # half-built result away entirely. Read its KDoc in
    # common/io/RunCatchingGuards.kt before adding a file here.
    forbiddenImports:
      - reason: 'Only the CXF import document boundary may absorb StackOverflowError/OutOfMemoryError.'
        value: 'com.artemchep.keyguard.common.io.runCatchingUntrustedInput'
    excludes:
      - '**/credentialexchange/impl/CxfImportServiceImpl.kt'
  MagicNumber:
    ignoreAnnotation: true
  UnusedPrivateFunction:
    ignoreAnnotated:
      - 'Preview'
  WildcardImport:
    excludeImports:
      - 'java.util.*'
      # Generated Compose resource accessors; a screen references dozens of the string
      # resources, so we usually collapse those to the wildcard.
      - 'com.artemchep.keyguard.res.*'
