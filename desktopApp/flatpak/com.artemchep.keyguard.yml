app-id: com.artemchep.keyguard
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
tags: [ proprietary ]
command: Keyguard
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --device=dri
  # Yubikey/FIDO2 security keys; no narrower permission exposes /dev/hidraw
  - --device=all
  - --filesystem=xdg-download:create
  - --filesystem=xdg-run/gnupg:create
  # Browser extension: the native messaging manifests of the browsers on the host.
  # No :create, so the sandbox sees only the folders that exist, which is how it
  # tells which browsers are used.
  - --filesystem=xdg-config/google-chrome/NativeMessagingHosts
  - --filesystem=xdg-config/chromium/NativeMessagingHosts
  - --filesystem=xdg-config/microsoft-edge/NativeMessagingHosts
  - --filesystem=xdg-config/BraveSoftware/Brave-Browser/NativeMessagingHosts
  - --filesystem=xdg-config/vivaldi/NativeMessagingHosts
  - --filesystem=~/.mozilla/native-messaging-hosts
  - --talk-name=org.kde.StatusNotifierWatcher
  - --system-talk-name=org.freedesktop.PolicyKit1
  # glibc gives the threads that allocate at the same time a malloc arena each,
  # up to eight per core, and the app has about a hundred of them: hundreds of
  # megabytes that hold almost nothing. Only the environment can cap them, and
  # only here: outside of a sandbox the programs the app starts would inherit it.
  - --env=MALLOC_ARENA_MAX=2
modules:
  - name: keyguard
    buildsystem: simple
    build-commands:
      - cp -rf app/* /app/
      - chmod +x /app/bin/Keyguard
    sources:
      # Pre-built x86_64 binaries of the app
      - type: dir
        only-arches:
          - x86_64
        path: "app-x86_64/"
        dest: "app/"
      # Pre-built aarch64 binaries of the app
      - type: dir
        only-arches:
          - aarch64
        path: "app-aarch64/"
        dest: "app/"
