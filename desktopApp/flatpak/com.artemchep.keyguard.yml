app-id: com.artemchep.keyguard
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
tags: [ proprietary ]
command: Keyguard
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --filesystem=xdg-download
  - --filesystem=xdg-run/gnupg:create
  - --talk-name=org.kde.StatusNotifierWatcher
  # The tray backend requests this well-known name before it registers the
  # icon with the watcher, and the number in it is the PID of the app inside
  # of the sandbox. Can be dropped once the backend registers the icon under
  # the unique connection name instead.
  - --own-name=org.kde.StatusNotifierItem-2-1
modules:
  - name: keyguard
    buildsystem: simple
    build-commands:
      - cp -rf app/* /app/
      - chmod +x /app/bin/Keyguard
    sources:
      # Pre-built x86_64 binaries of the app
      - type: dir
        only-arches:
          - x86_64
        path: "app-x86_64/"
        dest: "app/"
      # Pre-built aarch64 binaries of the app
      - type: dir
        only-arches:
          - aarch64
        path: "app-aarch64/"
        dest: "app/"
