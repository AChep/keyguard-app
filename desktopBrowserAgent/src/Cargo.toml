[package]
name = "keyguard-browser-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.0"
description = "Browser autofill agent for Keyguard password manager"
license-file = "../../LICENSE"
repository = "https://github.com/AChep/keyguard-app"
publish = false

[[bin]]
name = "keyguard-browser-agent"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures = "0.3"
async-trait = "0.1"

# Crypto: ECDH X25519 + AES-256-GCM + HMAC + HKDF
x25519-dalek = "2"
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
rand = "0.8"

# Serialization (JSON framing over the IPC channel)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
