[package]
name = "keyguard-browser-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The native messaging host of Keyguard's browser extension: relays its Noise frames to the app"
license-file.workspace = true
repository.workspace = true
publish = false
autobins = false

[[bin]]
name = "keyguard-browser-host"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64 = { workspace = true, features = ["alloc"] }
keyguard-cli-protocol.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
dirs.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "process", "test-util"] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
