[package]
name = "keyguard-gpg-agent"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "GPG agent for Keyguard password manager"
license-file.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "keyguard-gpg-agent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive"] }
common-gpg-agent-rust.workspace = true
keyguard-agent-identity.workspace = true
hex.workspace = true
prost.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
dirs.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# An older major than the workspace's getrandom.
getrandom = "0.2"
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util", "io-util", "macros", "rt"] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
