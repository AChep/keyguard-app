[package]
name = "keyguard-gpg-agent"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "GPG agent for Keyguard password manager"
license-file.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "keyguard-gpg-agent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
common-gpg-agent-rust.workspace = true
keyguard-agent-identity.workspace = true
keyguard-agent-ipc = { workspace = true, features = ["proto"] }
keyguard-gpg-agent-assuan.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
dirs.workspace = true

[target.'cfg(unix)'.dependencies]
keyguard-agent-proto-adapter.workspace = true
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# An older major than the workspace's getrandom.
getrandom = "0.2"

[dev-dependencies]
prost.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util", "io-util", "macros", "rt"] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
