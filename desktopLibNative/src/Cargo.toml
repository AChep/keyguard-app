[package]
name = "keyguard-lib"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.0"
description = "Native desktop helper library for Keyguard"
license-file = "../../LICENSE"
repository = "https://github.com/AChep/keyguard-app"
publish = false

[lib]
name = "keyguard"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
strip = true
lto = true
codegen-units = 1
