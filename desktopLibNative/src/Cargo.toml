[package]
name = "keyguard-lib"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.0"
description = "Native desktop helper library for Keyguard"
license-file = "../../LICENSE"
repository = "https://github.com/AChep/keyguard-app"
publish = false

[lib]
name = "keyguard"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
zeroize = "=1.9.0"

[target.'cfg(windows)'.dependencies]
subtle = "2.6"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_WinRT",
    "Win32_System_Threading",
] }
windows-future = "0.3.2"

[build-dependencies]
cc = "1"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
strip = true
lto = true
codegen-units = 1
