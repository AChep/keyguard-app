[package]
name = "keyguard-lib"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Native desktop helper library for Keyguard"
license-file.workspace = true
repository.workspace = true
publish = false

[lib]
name = "keyguard"
crate-type = ["cdylib"]

[dependencies]
libc.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
jni.workspace = true
keyguard-ffi = { workspace = true, features = ["jni"] }

[target.'cfg(target_os = "linux")'.dependencies]
serde = { workspace = true, features = ["derive"] }
zbus = { workspace = true, features = ["default-rt", "proxy"] }

[target.'cfg(windows)'.dependencies]
jni.workspace = true
keyguard-ffi = { workspace = true, features = ["jni"] }
subtle.workspace = true
windows = { workspace = true, features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_WinRT",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Rpc",
    "Win32_System_SystemServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# `#[implement]` expands to `::windows_core` paths.
windows-core.workspace = true
windows-future.workspace = true

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
cc.workspace = true

[lints.clippy]
undocumented_unsafe_blocks = "deny"
