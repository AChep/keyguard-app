[package]
name = "keyguard-ssh-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.0"
description = "SSH agent for Keyguard password manager"
license-file = "../../LICENSE"
repository = "https://github.com/AChep/keyguard-app"
publish = false

[[bin]]
name = "keyguard-ssh-agent"
path = "src/main.rs"

[dependencies]
common-ssh-agent-rust = { path = "../../commonSshAgent" }
keyguard-agent-identity = { path = "../../commonAgent" }
# SSH agent protocol
ssh-agent-lib = "0.5"
ssh-key = { version = "=0.6.7", features = ["ed25519", "rsa", "crypto"] }
ssh-encoding = "=0.2.0"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# Protobuf IPC
prost = "0.13"
bytes = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Hex encoding for auth token
hex = "0.4"

# Platform directories
dirs = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

[dev-dependencies]
signature = "2"
tokio = { version = "1", features = ["test-util", "io-util", "macros", "rt"] }
tempfile = "3"

[patch.crates-io]
# crates.io ssh-encoding 0.2.0
# (checksum eb9242b9ef4108a78e8cd1a2c98e193ef372437f8c22be363075233321dd4a15):
# backport the nested-length bounds check until the graph moves to ssh-encoding 0.3+.
ssh-encoding = { path = "../../thirdParty/rust/ssh-encoding-0.2.0-keyguard" }
# crates.io ssh-key 0.6.7
# (checksum 3b86f5297f0f04d08cabaa0f6bff7cb6aec4d9c3b49d87990d63da9d9156a8c3):
# backport bounded opaque-key decoding from current RustCrypto SSH.
ssh-key = { path = "../../thirdParty/rust/ssh-key-0.6.7-keyguard" }

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
strip = true
lto = true
codegen-units = 1
