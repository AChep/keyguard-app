[package]
name = "keyguard-ssh-agent"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "SSH agent for Keyguard password manager"
license-file.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "keyguard-ssh-agent"
path = "src/main.rs"

[dependencies]
common-ssh-agent-rust.workspace = true
keyguard-agent-identity.workspace = true
# SSH agent protocol
ssh-agent-lib.workspace = true
ssh-key = { workspace = true, features = ["ed25519", "rsa", "crypto"] }
ssh-encoding.workspace = true

# Async runtime
tokio = { workspace = true, features = ["full"] }
tokio-stream.workspace = true
futures.workspace = true
async-trait.workspace = true

# Protobuf IPC
prost.workspace = true
bytes.workspace = true

# CLI
clap = { workspace = true, features = ["derive"] }

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Hex encoding for auth token
hex.workspace = true

# Platform directories
dirs.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
signature.workspace = true
tokio = { workspace = true, features = ["test-util", "io-util", "macros", "rt"] }
tempfile.workspace = true

[lints.clippy]
undocumented_unsafe_blocks = "deny"
