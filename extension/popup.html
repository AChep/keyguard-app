<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Keyguard Autofill</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="theme.js"></script>
  </head>
  <body>
    <div class="popup">
      <div class="pop-head">
        <img class="pop-fav" id="fav" alt="" />
        <div style="min-width:0">
          <div class="pop-domain" id="domain">Keyguard</div>
          <div class="pop-sub" id="sub">Autofill</div>
        </div>
      </div>

      <div id="status" class="muted" style="font-size:13px;padding:0 4px 8px"></div>
      <div class="pop-list" id="items"></div>

      <div class="pop-foot">
        <a class="navlink" id="options" href="#">Options</a>
        <a class="navlink" id="about" href="#">About</a>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
