name: keyguard-bw-mtls

services:
  vaultwarden:
    image: ${VAULTWARDEN_IMAGE:?Use --env-file ../vaultwarden.env}
    env_file: ../vaultwarden.env
    environment:
      DOMAIN: https://localhost:8443
      WEB_VAULT_ENABLED: "true"
      DISABLE_ADMIN_TOKEN: "false"
    ports:
      # Local CLI setup only. Browser registration uses HTTPS on port 8444.
      - "127.0.0.1:18080:80"
    tmpfs:
      - /data
    healthcheck:
      test: [CMD, /healthcheck.sh]
      interval: 5s
      timeout: 3s
      retries: 12

  proxy:
    image: nginx:stable-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    depends_on:
      vaultwarden:
        condition: service_healthy
    ports:
      - "127.0.0.1:8443:443"
      - "127.0.0.1:8444:444"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./fixtures/server.pem:/etc/nginx/certs/server.pem:ro
      - ./fixtures/server-key.pem:/etc/nginx/certs/server-key.pem:ro
      - ./fixtures/ca.pem:/etc/nginx/certs/ca.pem:ro
