map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Loopback-only HTTPS web vault for registration without importing a browser
# client identity. The separate port 443 listener still requires mTLS.
server {
    listen 444 ssl;
    server_name localhost;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/certs/server.pem;
    ssl_certificate_key /etc/nginx/certs/server-key.pem;

    client_max_body_size 128m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;

    # Keep this web vault's API calls on the HTTPS setup origin. Vaultwarden's
    # canonical DOMAIN remains the mTLS endpoint advertised to Keyguard.
    location = /api/config {
        proxy_pass http://vaultwarden:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter 'https://localhost:8443' 'https://localhost:8444';
    }

    location / {
        proxy_pass http://vaultwarden:80;
    }
}

log_format mtls '$remote_addr $request_method $uri $status '
                'client="$ssl_client_s_dn" verified=$ssl_client_verify';

server {
    listen 443 ssl;
    server_name localhost;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/certs/server.pem;
    ssl_certificate_key /etc/nginx/certs/server-key.pem;
    ssl_client_certificate /etc/nginx/certs/ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 1;

    access_log /var/log/nginx/access.log mtls;
    client_max_body_size 128m;

    location / {
        proxy_pass http://vaultwarden:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
