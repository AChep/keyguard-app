pluginManagement {
    includeBuild("buildPlugins")
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
    resolutionStrategy {
        eachPlugin {
        }
    }
}
plugins {
    id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0"
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // JitPack builds artifacts on demand from arbitrary GitHub repos, so an
        // unscoped entry lets it answer for any coordinate in the build. Only
        // these three groups are unavailable from Central and Google; keep the
        // list exact so a compromised or typo-squatted repo cannot shadow a
        // dependency that should come from a first-party repository.
        maven {
            url 'https://jitpack.io'
            content {
                includeGroup 'com.github.AChep'
                includeGroup 'com.github.Kyant0'
                includeGroup 'com.github.open-keychain.open-keychain'
            }
        }
        maven { url "https://maven.pkg.jetbrains.space/public/p/compose/dev" }
    }
}
rootProject.name = "keyguard"

