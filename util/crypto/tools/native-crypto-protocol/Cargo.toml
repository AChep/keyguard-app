[package]
name = "native-crypto-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license-file = "../../../../LICENSE"
repository = "https://github.com/AChep/keyguard-app"
publish = false

[workspace]

[dependencies]
# Keep code generation aligned with the runtime used by the crypto workspace.
prost-build = "=0.13.5"

[lints.rust]
unsafe_code = "forbid"
unused_lifetimes = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
