[package]
name = "keyguard-fido2-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[dependencies]
keyguard-ffi.workspace = true
zeroize.workspace = true
sha2.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
authenticator = { workspace = true, features = ["crypto_rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Networking_WindowsWebServices", "Win32_UI_WindowsAndMessaging"] }
base64.workspace = true

# Narrower than the workspace lints, which also require documentation.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
