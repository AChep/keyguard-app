[workspace]
resolver = "2"
members = ["crates/keyguard-yubikey-core", "crates/keyguard-yubikey-c", "crates/keyguard-yubikey-jni"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license-file = "../../../LICENSE"

[workspace.dependencies]
keyguard-yubikey-core = { path = "crates/keyguard-yubikey-core" }
keyguard-ffi = { path = "../../ffi/rust/crates/keyguard-ffi" }
jni = { version = "=0.21.1", default-features = false }
zeroize = "=1.8.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
# Keep the Rust runtime in separate objects when linking several static Rust libraries.
lto = false
codegen-units = 1
panic = "unwind"
strip = true
