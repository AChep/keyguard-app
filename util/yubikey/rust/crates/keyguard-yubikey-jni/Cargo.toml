[package]
name = "keyguard-yubikey-jni"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
[lib]
crate-type = ["cdylib"]
[dependencies]
keyguard-ffi = { workspace = true, features = ["jni"] }
keyguard-yubikey-core.workspace = true
jni.workspace = true
# Narrower than the workspace lints, which also require documentation.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
