[package]
name = "keyguard-zip-core"
description = "Native ZIP archive writing for Keyguard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[dependencies]
keyguard-ffi.workspace = true
self_cell.workspace = true
zeroize.workspace = true
zip = { workspace = true, features = [
    "aes-crypto",
    "deflate-flate2-zlib-rs",
] }

[dev-dependencies]
# A newer major than the workspace's sha2.
sha2 = "0.11.0"

[lints]
workspace = true
